server.port=8085
spring.application.name=auth-service

# Database Connection — values come from environment variables
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}

# JWT Secret — used by JwtUtil
jwt.secret=${JWT_SECRET:aG90ZWxIdWJTZWNyZXRLZXlGb3JKV1RUb2tlblNpZ25pbmcyMDI2}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true