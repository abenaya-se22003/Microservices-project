spring.application.name=room-service
# Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/room_db
spring.datasource.username=postgres
spring.datasource.password=123456

# Hibernate/JPA Settings (This creates the tables automatically)
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Set port to 8081 so it doesn't clash with other services later
server.port=8081