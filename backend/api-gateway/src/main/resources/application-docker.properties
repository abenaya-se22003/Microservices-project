# ── Docker Profile for api-gateway ────────────────────────────────────
# Activated via SPRING_PROFILES_ACTIVE=docker in docker-compose.yml.
# Overrides application.properties — replaces 'localhost' with
# Docker container names so services can reach each other on the
# internal hotel-network bridge.

# Route 1: Room Service
spring.cloud.gateway.routes[0].id=room-service
spring.cloud.gateway.routes[0].uri=http://room-service:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/rooms/**

# Route 2: Guest Service
spring.cloud.gateway.routes[1].id=guest-service
spring.cloud.gateway.routes[1].uri=http://guest-service:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/guests/**

# Route 3: Reservation Service
spring.cloud.gateway.routes[2].id=reservation-service
spring.cloud.gateway.routes[2].uri=http://reservation-service:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/reservations/**

# Route 4: Auth Service
spring.cloud.gateway.routes[3].id=auth-service
spring.cloud.gateway.routes[3].uri=http://auth-service:8085
spring.cloud.gateway.routes[3].predicates[0]=Path=/auth/**

# CORS — allow both local dev (5173) and Docker frontend (3000)
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:3000,http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
