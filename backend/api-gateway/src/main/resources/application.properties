# Run the Gateway on the standard web port
server.port=8080

# --- ROUTING RULES ---

# Route 1: Forward room requests to port 8081
spring.cloud.gateway.routes[0].id=room-service
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/rooms/**

# Route 2: Forward guest requests to port 8082
spring.cloud.gateway.routes[1].id=guest-service
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/guests/**

# Route 3: Forward reservation requests to port 8083
spring.cloud.gateway.routes[2].id=reservation-service
spring.cloud.gateway.routes[2].uri=http://localhost:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/reservations/**

# Route 4: Forward auth requests to port 8085
spring.cloud.gateway.routes[3].id=auth-service
spring.cloud.gateway.routes[3].uri=http://localhost:8085
spring.cloud.gateway.routes[3].predicates[0]=Path=/auth/**


# Allow React Frontend to connect to the Gateway
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true