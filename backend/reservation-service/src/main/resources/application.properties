# Database Connection — values come from environment variables
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/reservation_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}

# Hibernate/JPA Settings
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Set port to 8083
server.port=8083

# RabbitMQ Connection
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Feign Client Configuration (for communication with other microservices)
spring.cloud.openfeign.client.config.room-service.url=${ROOM_SERVICE_URL:http://localhost:8081/api/rooms}
spring.cloud.openfeign.client.config.auth-service.url=${AUTH_SERVICE_URL:http://localhost:8085/auth/users}